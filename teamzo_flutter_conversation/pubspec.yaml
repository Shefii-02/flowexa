name: teamzo_flutter_conversation
description: Embeddable TeamZo website-chat widget for Flutter apps — flow menus, back / main menu / reset, and a "was your issue solved?" hand-off to staff.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
